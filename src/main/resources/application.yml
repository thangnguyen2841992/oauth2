server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: 8081

spring:
  profiles:
    default: local
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://onehost-amdcloudhn022602.000nethost.com:3306/tsezwyvdhosting_nihongo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=15000
    username: tsezwyvdhosting_nihongo_app
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 45000
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    admin:
      auto-create: ${KAFKA_AUTO_CREATE_TOPICS:true}
    producer:
      acks: all
      enable-idempotence: true
      retries: 5
      max-in-flight-requests-per-connection: 1
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
  task:
    scheduling:
      pool:
        size: 2

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_ADVERTISED_ADDRESS:127.0.0.1}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:}
  access-expiration: 300000
  refresh-expiration: 604800000
  admin-refresh-expiration: 28800000
  admin-idle-timeout: 1800000

google:
  client-id: 243434037577-d3hf8i7nijo996g3ate2pibmsli3bhff.apps.googleusercontent.com
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8082/api/auth/callbackGoogle}

api:
  key: thangdeptrai
