server:
  port: 8081

spring:
  config:
    import: "optional:file:./.local/user.properties,optional:file:../.local/user.properties"
  application:
    name: user-service

  data:
    redis:
      host: ${REDIS_HOST:160.22.107.232}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}

  datasource:
    url: jdbc:mysql://onehost-amdcloudhn022602.000nethost.com:3306/tsezwyvdhosting_nihongo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: tsezwyvdhosting_nihongo_app
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 45000
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:160.22.107.232:9092}
    producer:
      acks: all
      enable-idempotence: true
      retries: 5
      max-in-flight-requests-per-connection: 1
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 300000
  refresh-expiration: 604800000
  admin-refresh-expiration: 28800000
  admin-idle-timeout: 1800000

google:
  client-id: 243434037577-d3hf8i7nijo996g3ate2pibmsli3bhff.apps.googleusercontent.com
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8082/api/auth/callbackGoogle}

api:
  key: thangdeptrai

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
