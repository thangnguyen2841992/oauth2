server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: 8081
  compression:
    enabled: true
    min-response-size: 1024

spring:
  profiles:
    default: local
  application:
    name: user-service

  datasource:
    url: jdbc:mariadb://onehost-amdcloudhn022602.000nethost.com:3306/tsezwyvdhosting_nihongo?sslMode=disable&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=15000
    username: tsezwyvdhosting_nihongo_app
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.mariadb.jdbc.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      max-lifetime: ${DB_CONNECTION_MAX_LIFETIME:900000}
      keepalive-time: ${DB_CONNECTION_KEEPALIVE:60000}
      idle-timeout: ${DB_CONNECTION_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: 5000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        default_batch_fetch_size: 50
        jdbc:
          fetch_size: 100

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    admin:
      auto-create: ${KAFKA_AUTO_CREATE_TOPICS:true}
    producer:
      acks: all
      enable-idempotence: true
      retries: 5
      max-in-flight-requests-per-connection: 1
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
  task:
    scheduling:
      pool:
        size: 2

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_ADVERTISED_ADDRESS:127.0.0.1}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:}
  access-expiration: 300000
  refresh-expiration: 604800000
  admin-refresh-expiration: 28800000
  admin-idle-timeout: 1800000

google:
  client-id: 243434037577-d3hf8i7nijo996g3ate2pibmsli3bhff.apps.googleusercontent.com
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8082/api/auth/callbackGoogle}
